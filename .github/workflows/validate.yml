name: Validate learning plan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check plan links and milestones
        run: python scripts/check_plan.py
      - name: Test bounded learning examples
        run: python -m unittest discover -s minilab/tests -v
